
services:
  backend:
    # Get the image from GitHub Container Registry
    image: marketdash:latest

    container_name: marketdash
    ports:
      - "8000:8000"
    environment:
      - RUST_LOG=info
      - ROCKET_PORT=8000
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_OTEL_ENDPOINT=http://docker-host-ubuntu.tail447f59.ts.net:4318/v1/logs
    restart: unless-stopped
    networks:
      - marketdash-network

networks:
  marketdash-network:
    driver: bridge